 const V={it:IT,last:lastDigits,st:live?(CUR.seq.win&&CUR.t>=CUR.pl.T4?CUR.st1:CUR.st0):snap()};
 if(live){V.seq=CUR.seq;V.pl=CUR.pl;V.t=CUR.t;V.drink=CUR.drink;V.skipHint=mode!=='result'&&!PV;}else{V.t=-1;if(mode==='idle')V.hint=t('tap');}
 if(FEED&&mode!=='title'){const a=IT-FEED.at;V.feed=a<4.5?{text:FEED.text,col:FEED.col,a:Math.min(1,a/.3,(4.5-a)/.5)}:null;}
 return V;}
function frame(dt){IT+=dt;
 if((mode==='seq'||mode==='replay')&&CUR){const a=CUR.t;CUR.t=Math.min(CUR.pl.END,CUR.t+dt);runSfx(EV,a,CUR.t);if(CUR.t>=CUR.pl.END)finish();}
 if(mode!=='video')paint(G,cv.width,cv.height,view());}
let lastNow=0;function loop(now){const dt=Math.min(.1,(now-lastNow)/1000)||0;lastNow=now;try{frame(dt);}catch(e){console.error(e);}requestAnimationFrame(loop);}

// ===== 買う =====
function rnd4(){const a=new Uint32Array(4);try{crypto.getRandomValues(a);}catch(e){for(let i=0;i<4;i++)a[i]=Math.floor(Math.random()*4294967296);}return a;}
let FORCE=null;{const f=Q.get('force');if(f&&TEST){const [k,v]=f.split(':');FORCE=k==='win'?{win:true,c:v==null?undefined:+v}:k==='li'?{win:false,li:+v}:null;}}
function buy(drink,force){if(mode==='video'||mode==='seq')return;audio();killBus();
 const r=rnd4(),seq=makeSeq(r[0],r[1]/4294967296,r[2]/4294967296,r[3]/4294967296,force||FORCE);
 S.b++;const st0=snap();
 if(seq.win){seq.newc=!(S.got[seq.c]>0);S.got[seq.c]++;seq.cnt=S.got[seq.c];S.w++;if(!S.comp&&S.got.every(x=>x>0)){seq.comp=true;S.comp=S.b;}}
 save();const st1=snap();
 CUR={seq,pl:plan(seq),t:0,drink:drink==null?0:drink,st0,st1};EV=sfxEvents(seq,CUR.pl);mode='seq';show(null);$('quitBtn').hidden=true;}
function finish(){
 if(mode==='replay'){killBus();CUR=KEEP;KEEP=null;mode='zukan';openZukan();return;}
 mode='result';lastDigits=CUR.seq.d;fillResult();show('result');$('result').querySelector('.card').scrollTop=0;
 if(CUR.seq.win)afterWin(CUR.seq,CUR.st1.b);}
// 飛ばす：回っている途中なら止まるところへ、当たりの演出なら「何色か」の帯へ、コンプなら文字のところへ
function skip(){if(!CUR||!(mode==='seq'||mode==='replay')||CUR.t<.35)return;const p=CUR.pl,s=CUR.seq,pts=[p.T4-.02];
 if(s.win){if(CUR.t>=p.T4-.02&&CUR.t<p.W0+.6)return;pts.push(p.W0+8.3);if(s.comp)pts.push(p.C0+4.9);pts.push(p.END);}
 const to=pts.find(x=>x>CUR.t+.05);if(to==null)return;killBus();CUR.t=to;}
addEventListener('keydown',e=>{if(e.code!=='Space'&&e.code!=='Enter')return;if(e.target&&/INPUT|BUTTON/.test(e.target.tagName))return;e.preventDefault();audio();if(mode==='idle')buy(Math.floor(Math.random()*12));else if(mode==='result'&&!$('result').hidden)buy(CUR?CUR.drink:0);else if(mode==='seq'||mode==='replay')skip();});
cv.addEventListener('pointerdown',e=>{audio();
 if(mode==='idle'){const r=cv.getBoundingClientRect(),d=cv.width/r.width,i=hitDrink((e.clientX-r.left)*d,(e.clientY-r.top)*d,cv.width,cv.height);if(i>=0)buy(i);return;}
 if(mode==='seq'||mode==='replay')skip();});

let vidBusy=false,VCV=null;
function pickMime(){const c=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];for(const m of c){try{if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;}catch(e){}}return '';}
function vidPlan(){const p=CUR.pl,s=CUR.seq,T0=s.win?Math.max(0,p.T3-.25):0,LEN=p.END-T0;return {T0,LEN,C0:LEN+(s.win?.1:.5),TOT:LEN+(s.win?2.5:2.9)};}
function vidView(tt,pl){const st=CUR.seq.win&&pl.T0+tt>=CUR.pl.T4?CUR.st1:CUR.st0;return {seq:CUR.seq,pl:CUR.pl,t:Math.min(CUR.pl.END,pl.T0+tt),it:IT+tt,st:tt>=pl.C0?CUR.st1:st,drink:CUR.drink,card:cl((tt-pl.C0)/.35,0,1)};}
async function makeVideo(){if(vidBusy||!CUR||mode!=='result')return;const mime=pickMime();if(!mime||!HTMLCanvasElement.prototype.captureStream){vidDone(null);return;}vidBusy=true;audio();killBus();
 const W=720,H=1280;if(!VCV){VCV=document.createElement('canvas');VCV.width=W;VCV.height=H;}const g=VCV.getContext('2d');
 $('recBadge').textContent=t('rec');$('recBadge').hidden=false;show(null);
 const pl=vidPlan(),E=sfxEvents(CUR.seq,CUR.pl);paint(g,W,H,vidView(0,pl));
 const st=VCV.captureStream(30);let dest=null;const AC=actx(),master=aout();try{if(AC){dest=AC.createMediaStreamDestination();master.connect(dest);for(const tr of dest.stream.getAudioTracks())st.addTrack(tr);}}catch(e){}
 const fin=()=>{try{if(dest)master.disconnect(dest);}catch(_){}killBus();$('recBadge').hidden=true;mode='result';vidBusy=false;};
 const chunks=[];let rec;try{rec=new MediaRecorder(st,{mimeType:mime,videoBitsPerSecond:4000000});}catch(e){fin();vidDone(null);return;}
 rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};const stopped=new Promise(r=>rec.onstop=r);
 mode='video';rec.start(200);let lt=performance.now(),tt=0;
 await new Promise(res=>{function stp(now){const dt=Math.min(.1,(now-lt)/1000);lt=now;const a=tt;tt+=dt;if(a<pl.LEN)runSfx(E,pl.T0+a,pl.T0+Math.min(tt,pl.LEN+.001));paint(g,W,H,vidView(tt,pl));
   G.setTransform(1,0,0,1,0,0);G.fillStyle='#070a1f';G.fillRect(0,0,cv.width,cv.height);const k=Math.min(cv.width/W,cv.height/H);G.drawImage(VCV,(cv.width-W*k)/2,(cv.height-H*k)/2,W*k,H*k);
   if(tt>=pl.TOT)res();else requestAnimationFrame(stp);}requestAnimationFrame(stp);});
 rec.stop();await stopped;fin();vidDone(new Blob(chunks,{type:mime.split(';')[0]}),mime);}
function vidDone(blob,mime){mode='result';show('vidPanel');
 if(!blob||!blob.size){$('vMsg').textContent=t('vfail');$('vShare').hidden=$('vSave').hidden=true;$('vidPrev').hidden=true;return;}
 $('vidPrev').hidden=false;const url=URL.createObjectURL(blob);$('vidPrev').src=url;$('vidPrev').play().catch(()=>{});
 const ext=/mp4/.test(mime)?'mp4':'webm',nm='jihanki_'+Date.now()+'.'+ext,file=new File([blob],nm,{type:blob.type}),canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
 $('vShare').hidden=!canShare;$('vSave').hidden=false;$('vMsg').textContent=canShare?t('vmade'):t('shareHint');
 $('vShare').onclick=async()=>{try{await navigator.share({files:[file],text:postText()+'\n'+shareURL()});gaEv('x_share');}catch(e){}};
 $('vSave').onclick=()=>{const a=document.createElement('a');a.href=url;a.download=nm;document.body.appendChild(a);a.click();a.remove();};}
$('vidBtn').onclick=()=>makeVideo();$('vX').onclick=()=>openX(postText(),shareURL());$('vBack').onclick=()=>show('result');

async function sendCount(id){if(S.sent.includes(id))return;
 if(TEST){S.sent.push(id);save();if(CNT)CNT.v[id]=(CNT.v[id]||0)+1;return;}
 try{const a=await fbAuth(),body={};body['u/'+a.uid+'/'+id]=TS;body['c/'+id]={'.sv':{increment:1}};
  const r=await fetchR(DBR+QA(a),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

 }catch(e){console.warn(e);}}

let feedSeen=Date.now()-60000,feedQ=[];
async function pollFeed(){if(TEST||document.hidden||mode==='title'||mode==='video')return;
 try{const r=await fetchR(DBR+'/f.json?orderBy=%22t%22&limitToLast=6');if(!r.ok)return;const j=(await r.json())||{},me=(AUTH||ls.get('jh_auth',null)||{}).uid;

  for(const x of rows){feedSeen=Math.max(feedSeen,x.t);feedQ.push(x);}if(feedQ.length>6)feedQ=feedQ.slice(-6);}catch(e){}}
